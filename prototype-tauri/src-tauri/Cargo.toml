[package]
name = "mdviewer-proto"
version = "0.1.0"
edition = "2021"
description = "MD Viewer 용량 측정용 Tauri 프로토타입"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 크기 측정이 목적이므로 실제 배포에 쓸 최적화를 그대로 켠다.
[profile.release]
opt-level = "z"     # 속도보다 크기
lto = true          # 링크 시점 최적화
codegen-units = 1   # 병렬 코드 생성 포기, 크기 우선
panic = "abort"     # 되감기 테이블 제거
strip = true        # 디버그 심볼 제거
