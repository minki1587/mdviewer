<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src file: data: blob: https:; font-src file: data:; connect-src 'none';" />
  <title>MD Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light" class="mode-split blank">

  <header id="bar">
    <button id="btn-open" class="ghost" title="파일 열기 (Ctrl+O)" aria-label="파일 열기">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.6l1.4 1.6H16A1.5 1.5 0 0 1 17.5 7v7.5A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
    </button>

    <div id="crumb">
      <span id="crumb-name">파일 없음</span>
      <span id="dot" hidden title="저장하지 않은 변경 내용">&#9679;</span>
      <span id="crumb-dir"></span>
    </div>

    <div id="modes" role="group" aria-label="보기 방식">
      <button data-mode="read"  title="읽기 (Ctrl+E)">읽기</button>
      <button data-mode="edit"  title="편집 (Ctrl+E)">편집</button>
      <button data-mode="split" title="나란히 (Ctrl+Shift+E)">나란히</button>
    </div>

    <button id="btn-toc" class="ghost" title="목차 고정 (Ctrl+\)" aria-label="목차 고정">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h3v1.6H3zm5 0h9v1.6H8zM3 9.2h3v1.6H3zm5 0h9v1.6H8zM3 13.4h3V15H3zm5 0h9V15H8z"/></svg>
    </button>
    <button id="btn-theme" class="ghost" title="어두운 화면 (Ctrl+D)" aria-label="화면 밝기 전환">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.6a7.4 7.4 0 1 0 7.4 7.4A5.9 5.9 0 0 1 10 2.6"/></svg>
    </button>
  </header>

  <!-- 리딩 레일: 목차이자 읽은 위치 표시기 (읽기 모드에서만) -->
  <nav id="rail" aria-label="문서 목차">
    <div id="progress" aria-hidden="true"></div>
    <ol id="ticks"></ol>
  </nav>

  <div id="panes">
    <section id="editor-pane" aria-label="편집기">
      <div id="editor"></div>
    </section>

    <div id="gutter" role="separator" aria-orientation="vertical" aria-label="너비 조절"></div>

    <main id="scroller" tabindex="-1">
      <article id="doc" class="markdown"></article>

      <section id="empty">
        <div class="empty-mark" aria-hidden="true">
          <span>#</span><span>##</span><span>###</span>
        </div>
        <h1>마크다운 파일을 열거나 새로 쓰세요</h1>
        <p>창 안으로 <b>.md</b> 파일을 끌어다 놓아도 됩니다.</p>
        <div class="empty-actions">
          <button id="empty-open" class="solid">파일 열기</button>
          <button id="empty-new" class="solid">새 문서</button>
        </div>
        <p class="hint">Ctrl+O 열기 · Ctrl+N 새 문서 · Ctrl+E 읽기/편집 전환</p>
      </section>
    </main>
  </div>

  <footer id="status">
    <span id="stat-pos"></span>
    <span id="stat-count"></span>
    <span id="stat-save">저장됨</span>
  </footer>

  <div id="drop" aria-hidden="true"><span>여기에 놓으면 엽니다</span></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/editor.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
