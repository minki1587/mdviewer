[package]
name = "md-viewer"
# 실제 버전은 package.json 에 있다. tauri.conf.json 의 version 이 그 파일을
# 가리키고, 앱과 설치 파일은 그 값을 쓴다. 여기 값은 cargo 형식상 필요할 뿐이다.
version = "0.0.0"
description = "마크다운 뷰어 겸 편집기"
authors = ["minki1587"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 배포용 최적화 — 목적이 용량이므로 속도보다 크기를 택한다.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
