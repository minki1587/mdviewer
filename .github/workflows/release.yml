# main 에 푸시되면 Windows 설치 파일을 만들어 GitHub 릴리스에 올린다.
#
#   npm version 1.3.1        (package.json 갱신 + 커밋 + v1.3.1 태그)
#   git push origin main
#
# package.json 의 version 이 올라간 푸시에서만 릴리스를 만든다.
# 같은 버전으로 여러 번 푸시해도 이미 발행된 릴리스가 있으면 조용히 넘어간다.
#
# 설치된 앱은 이 릴리스의 latest.yml 을 보고 새 버전을 감지한다.
# (electron-builder 가 v<version> 태그와 릴리스를 직접 만든다)

name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 이미 발행된 버전인지 확인
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" > /dev/null 2>&1; then
            echo "이미 v${{ steps.ver.outputs.version }} 릴리스가 있습니다. 건너뜁니다."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "v${{ steps.ver.outputs.version }} 을 새로 발행합니다."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: 빌드 후 릴리스에 올리기
        if: steps.check.outputs.exists == 'false'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 산출물 보관
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
