# main 에 푸시되면 Windows 설치 파일을 만들어 GitHub 릴리스에 올린다.
#
#   npm version 1.3.1        (package.json 갱신 + 커밋 + v1.3.1 태그)
#   git push origin main
#
# package.json 의 version 이 올라간 푸시에서만 릴리스를 만든다.
# 같은 버전으로 여러 번 푸시해도 이미 발행된 릴리스가 있으면 조용히 넘어간다.
#
# 설치된 앱은 이 릴리스의 latest.yml 을 보고 새 버전을 감지한다.
# (electron-builder 가 v<version> 태그와 릴리스를 직접 만든다)

name: release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 릴리스 존재 여부만 보면 안 된다. 업로드가 중간에 끊겨 exe 만 올라간
      # 릴리스가 남아 있으면, 그걸 "발행 완료"로 오해해 영영 건너뛰게 된다.
      # 앱이 실제로 읽는 latest.yml 이 붙어 있어야 발행이 끝난 것으로 본다.
      - name: 발행이 끝난 버전인지 확인
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "$tag 에 latest.yml 이 이미 있습니다. 건너뜁니다."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag 을 발행합니다. (릴리스가 없거나 latest.yml 이 빠져 있음)"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: 빌드 후 릴리스에 올리기
        if: steps.check.outputs.exists == 'false'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 112MB 짜리 exe 업로드 뒤 작은 파일들이 실패하는 일이 실제로 있었다.
      # exe 만 올라가고 latest.yml 이 빠지면 앱은 새 버전을 영영 보지 못하므로,
      # 발행 단계가 실패했더라도 빠진 파일을 여기서 다시 올린다.
      - name: 첨부 파일 점검 (빠진 것은 다시 올림)
        if: ${{ steps.check.outputs.exists == 'false' && !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          exe="md-viewer-${{ steps.ver.outputs.version }}-setup.exe"
          for f in "$exe" "$exe.blockmap" latest.yml; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "$f"; then
              echo "확인  $f"
            elif [ -f "dist/$f" ]; then
              echo "누락  $f — 다시 올립니다"
              gh release upload "$tag" "dist/$f" --clobber
            else
              echo "::error::dist/$f 가 없어 올릴 수 없습니다"
              exit 1
            fi
          done
          echo "=== 최종 첨부 목록 ==="
          gh release view "$tag" --json assets --jq '.assets[].name'

      - name: 산출물 보관
        if: ${{ steps.check.outputs.exists == 'false' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
