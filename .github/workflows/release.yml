# 태그를 올리면 Windows 설치 파일을 만들어 GitHub 릴리스에 올린다.
#
#   npm version 1.3.0        (package.json 갱신 + 커밋 + v1.3.0 태그)
#   git push --follow-tags
#
# 설치된 앱은 이 릴리스의 latest.yml 을 보고 새 버전을 감지한다.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드 후 릴리스에 올리기
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
