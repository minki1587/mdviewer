# Tauri 프로토타입을 windows 러너에서 빌드해 실제 용량을 잰다.
#
# 로컬에 Rust 와 MSVC 빌드 도구(수 GB)를 설치하지 않으려고 CI 에서 재는 것이다.
# 이 워크플로는 tauri-prototype 브랜치에서만 돈다. 릴리스 워크플로(main)와 무관하다.

name: tauri-proto

on:
  push:
    branches:
      - tauri-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 프런트엔드 자산은 저장소에 넣지 않고 여기서 만든다.
      # Electron 판이 실제로 쓰는 것과 같은 파일을 그대로 실어야 측정이 의미가 있다.
      - name: 프런트엔드 자산 준비
        shell: bash
        run: |
          npm ci
          npm run build:editor
          mkdir -p prototype-tauri/dist/vendor
          cp renderer/index.html renderer/renderer.js renderer/style.css \
             renderer/help-data.js prototype-tauri/dist/
          cp renderer/vendor/editor.js prototype-tauri/dist/vendor/
          npx esbuild prototype-tauri/preview-entry.js \
            --bundle --format=iife --minify --target=chrome120 \
            --outfile=prototype-tauri/dist/preview.js
          echo "--- 실린 웹 자산 ---"
          find prototype-tauri/dist -type f -exec sh -c 'echo "$(stat -c %s "$1") bytes  $1"' _ {} \;

      - name: Tauri CLI 설치
        working-directory: prototype-tauri
        run: npm install

      - name: 빌드
        working-directory: prototype-tauri
        run: npx tauri build

      - name: 용량 측정
        shell: bash
        working-directory: prototype-tauri
        run: |
          echo "=============================================="
          echo " Tauri 프로토타입 실측"
          echo "=============================================="

          bin=$(find src-tauri/target/release -maxdepth 1 -name "*.exe" | head -1)
          echo "앱 실행 파일 : $bin"
          echo "             $(stat -c %s "$bin") bytes  ($(( $(stat -c %s "$bin") / 1024 / 1024 )) MB)"
          echo

          echo "--- NSIS 번들 ---"
          find src-tauri/target/release/bundle -type f | while read -r f; do
            echo "$(stat -c %s "$f") bytes  $f"
          done
          echo

          setup=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -n "$setup" ]; then
            s=$(stat -c %s "$setup")
            echo "설치 파일 : $s bytes ($(( s / 1024 / 1024 )) MB)"
          fi
          echo

          echo "=============================================="
          echo " Electron 판과 비교 (설치 후 기준)"
          echo "   Electron : 377.5 MB  / 설치 파일 112.7 MB"
          echo "   Tauri    : 위 수치 참고"
          echo "=============================================="

      - name: 설치 파일 보관
        uses: actions/upload-artifact@v4
        with:
          name: tauri-proto-installer
          path: prototype-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
