# Tauri 판을 빌드해 GitHub 릴리스로 발행한다.
#
#   git tag v2.0.0
#   git push origin v2.0.0
#
# tauri-action 이 설치 파일과 함께 latest.json 을 만들어 붙인다.
# 설치된 앱은 tauri.conf.json 의 endpoints 가 가리키는
# releases/latest/download/latest.json 을 보고 새 버전을 판단한다.
#
# main 푸시에는 tauri-build.yml 이 컴파일만 확인하고, 발행은 태그를 민
# 이 워크플로만 한다.

name: tauri-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 프런트엔드 번들
        run: npm run build:web

      - name: 서명 키 확인
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # bundle.createUpdaterArtifacts 가 켜져 있으면 번들러가 산출물에
          # 서명한다. 키가 없으면 번들러 깊은 곳에서 exit 1 로만 죽어
          # 무엇이 문제인지 로그를 열기 전에는 알 수 없다. 여기서 먼저 막는다.
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 시크릿이 비어 있습니다. 업데이터 산출물(latest.json)에 서명할 수 없습니다. 로컬에서 'npx tauri signer generate -w ~/.tauri/mdviewer.key' 로 키를 만들고, 개인키 파일 내용을 저장소 Settings > Secrets and variables > Actions 에 TAURI_SIGNING_PRIVATE_KEY 로 넣으세요. 공개키는 tauri.conf.json 의 plugins.updater.pubkey 와 같아야 합니다 (키 ID 5F248B86F96924F5)."
            exit 1
          fi
          echo "서명 키 있음"

      - name: 빌드 후 릴리스 발행
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: MD Viewer v__VERSION__
          releaseBody: |
            Windows 설치 파일은 아래 `.exe` 를 받으세요.

            서명서가 없어 SmartScreen 경고가 뜹니다.
            **추가 정보 → 실행** 으로 진행하시면 됩니다.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
