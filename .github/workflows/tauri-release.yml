# Tauri 판을 빌드해 GitHub 릴리스로 발행한다.
#
#   git tag v2.0.0
#   git push origin v2.0.0
#
# tauri-action 이 설치 파일과 함께 latest.json 을 만들어 붙인다.
# 설치된 앱은 tauri.conf.json 의 endpoints 가 가리키는
# releases/latest/download/latest.json 을 보고 새 버전을 판단한다.
#
# main 푸시에는 tauri-build.yml 이 컴파일만 확인하고, 발행은 태그를 민
# 이 워크플로만 한다.

name: tauri-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 프런트엔드 번들
        run: npm run build:web

      - name: 서명 키 확인
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 값이 없거나 깨져 있으면 2분짜리 Rust 빌드를 다 돌린 뒤에야
          # 번들러가 'failed to decode base64 secret key' 로 죽는다.
          # 실제로 그렇게 한 번 잃었다. 형식은 여기서 먼저 본다.
          # 값 자체는 절대 찍지 않는다.
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 시크릿이 비어 있습니다. 개인키 파일(base64 한 줄)의 내용을 저장소 Settings > Secrets and variables > Actions 에 넣으세요."
            exit 1
          fi
          if printf %s "$KEY" | head -c 3 | od -An -tx1 | tr -d '[:space:]' | grep -qi '^efbbbf'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 값이 UTF-8 BOM(EF BB BF)으로 시작합니다. base64 디코딩이 첫 글자에서 실패합니다. 메모장이나 PowerShell 리디렉션을 거치지 말고 '[IO.File]::ReadAllText(\"\$HOME\Downloads\tauri-updater.key\") | Set-Clipboard' 로 복사해 다시 넣으세요."
            exit 1
          fi
          if ! printf %s "$KEY" | tr -d '[:space:]' | base64 -d > /dev/null 2>&1; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 값이 base64 로 읽히지 않습니다. 개인키 파일 전체를 그대로(앞뒤 따옴표나 설명 없이) 넣었는지 확인하세요."
            exit 1
          fi
          echo "서명 키 형식 확인됨"

      - name: 빌드 후 릴리스 발행
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: MD Viewer v__VERSION__
          releaseBody: |
            Windows 설치 파일은 아래 `.exe` 를 받으세요.

            서명서가 없어 SmartScreen 경고가 뜹니다.
            **추가 정보 → 실행** 으로 진행하시면 됩니다.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
